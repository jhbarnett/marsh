<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <!-- Marsh: a pelican floating on still water at dusk. Ghibli Forest palette. -->
  <circle cx="64" cy="64" r="62" fill="#1A2420"/>
  <!-- moon -->
  <circle cx="33" cy="29" r="12" fill="#E8DFD0" opacity="0.16"/>
  <!-- water surface + far ripple -->
  <path d="M12 90 q12 -4.5 24 0 t24 0 24 0 24 0" stroke="#6B9AC4" stroke-width="3" fill="none" stroke-linecap="round" opacity="0.65"/>
  <path d="M34 102 q10 -3.5 20 0 t20 0" stroke="#6B9AC4" stroke-width="2" fill="none" stroke-linecap="round" opacity="0.3"/>
  <!-- reflection -->
  <ellipse cx="60" cy="99" rx="20" ry="2.8" fill="#E8DFD0" opacity="0.1"/>
  <!-- tail tip -->
  <path d="M36 78 L28 71 L38 72 Z" fill="#E8DFD0"/>
  <!-- body: floating on the waterline -->
  <ellipse cx="56" cy="80" rx="23" ry="13" fill="#E8DFD0"/>
  <!-- folded-wing hint -->
  <path d="M42 76 C52 84 66 85 72 79" stroke="#1A2420" stroke-width="3" fill="none" stroke-linecap="round" opacity="0.12"/>
  <!-- neck: short and stout -->
  <path d="M70 74 C78 70 80 60 78 52" stroke="#E8DFD0" stroke-width="8" fill="none" stroke-linecap="round"/>
  <!-- head -->
  <circle cx="77" cy="47" r="7.5" fill="#E8DFD0"/>
  <!-- the pelican bill: long flat top, deep pouch beneath -->
  <path d="M83 43 L113 52 L84 50 Z" fill="#F4A460"/>
  <path d="M83 49 L111 53 Q97 68 82 53 Z" fill="#F4A460" opacity="0.88"/>
  <!-- eye -->
  <circle cx="78.5" cy="45" r="1.7" fill="#1A2420"/>
</svg>
